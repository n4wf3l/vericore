<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page introuvable (404) | Vericore SRL</title>
    <meta name="description" content="La page que vous recherchez n'existe pas ou a été déplacée. Retrouvez nos services de rénovation et maintenance à Bruxelles." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #1f2937;
      }
      .container {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        color: #1e40af;
        font-weight: 600;
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #111827;
      }
      p {
        font-size: 1.125rem;
        color: #4b5563;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      a.primary { background: #1e40af; color: #fff; }
      a.primary:hover { background: #1e3a8a; }
      a.secondary { background: #f3f4f6; color: #1f2937; }
      a.secondary:hover { background: #e5e7eb; }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="code">404</p>
      <h1>Page introuvable</h1>
      <p>La page que vous recherchez n'existe pas ou a été déplacée.</p>
      <div class="actions">
        <a href="/" class="btn primary">Accueil</a>
        <a href="/expertises" class="btn secondary">Nos expertises</a>
      </div>
    </div>
  </body>
</html>
