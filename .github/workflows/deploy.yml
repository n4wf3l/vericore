name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (prerender 486 pages + bundle)
        env:
          VITE_BASE_URL: https://vericore.be
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_EMAIL_TO: ${{ secrets.VITE_EMAIL_TO }}
        run: npm run build:seo

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE }}/
          # Delta sync : seuls les fichiers modifiés sont uploadés (via .ftp-deploy-sync-state.json)
          state-name: .ftp-deploy-sync-state.json
          # Ignorer le fichier state lui-même + éviter de re-uploader des caches
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/stats.html
          timeout: 60000
          log-level: standard
